# 评测宿主目录的 ruff 配置（2026-09-15 代码审查 S3/N5 引入）。
#
# 动机：仓库原本**没有** ruff 配置，导致同一目标在不同 CWD 下结论不一致——
# 从仓库根跑 `ruff check dispatch-output/...` 通过，从 `backend/` 跑同一路径却报
# 12 个 E402（因为 ruff 在 backend/ 下按另一套默认规则解析）。
# 而 `serve.py` **必须**先 `sys.path.insert` / `os.chdir` / 设置业务库与配额库环境变量，
# 再 `import main`——这是评测宿主的隔离设计，E402 在此是**预期内**的，不是缺陷。
#
# 加本文件后，无论从哪个 CWD 调用，该目录的检查口径都一致；CI 步骤也因此可稳定复现。
[lint]
ignore = ["E402"]
