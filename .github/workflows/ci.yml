name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # D-25 源探针：镜像源的 404/冻结是**时间**的函数，不是某个 PR 的函数，所以每天自己跑一次。
    # 注：Actions 的 schedule 只在默认分支上生效 ⇒ 本仓默认分支是 master，合并进去之前这条不会自动触发，
    # 期间用 workflow_dispatch 手动拉。
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  backend:
    name: Backend · lint/type/test/audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 先装 CPU 版 torch，避免 PyPI 默认拉取数 GB 的 CUDA 包。
      # 2026-10-10：原先不钉版本 ⇒ CI 每天装的 torch 都在漂，而 requirements 里没有 torch，
      # 下面 `pip-audit -r requirements.txt` 对它永久失明。现与 backend/requirements.txt、
      # backend/Dockerfile 同钉 2.13.0，让本机/CI/镜像三根轴对齐。
      - name: Install CPU torch
        run: pip install "torch==2.13.0+cpu" --index-url https://download.pytorch.org/whl/cpu
      # 2026-10-19 W10：把 2026-10-19 网络批离线交叉平台解析得到的 runtime 传递闭包冻结为
      #   backend/constraints.txt，装依赖时 `-c` 约束到同一组精确版本，消掉「每天新解析漂移」
      #   （如 transformers 5.19.0↔5.20.1、langsmith 0.14.7↔0.14.11）。
      #   constraints 只约束不安装；dev-only 工具（pytest/ruff/mypy/…）不在其中，仍自由解析。
      #   torch 已在上一行单独装 2.13.0+cpu，故 constraints 写 2.13.0（PEP 440 本地段规则），不逼回 CUDA。
      - name: Install deps
        run: pip install -r requirements-dev.txt -c constraints.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy .
      - name: Pytest (skip slow) with coverage
        env:
          PYTEST_ADDOPTS: "-m 'not slow'"
        run: pytest --cov=. --cov-fail-under=70 -q
      # 评测宿主目录（dispatch-output/agent-quality-20260911）不在 backend 的
      # lint/format/test 门禁范围内（backend project 的 testpaths=["tests"]），
      # 2026-09-15 代码审查发现该缺陷（守卫代码曾累积 18 项 lint 违规且无人拦）。
      # 该目录自带 ruff.toml（显式 ignore E402：serve.py 需先设环境再 import main）。
      - name: Dispatch-output lint + guard tests
        run: |
          ruff check ../dispatch-output/agent-quality-20260911
          ruff format --check ../dispatch-output/agent-quality-20260911
          pytest -q ../dispatch-output/agent-quality-20260911/test_budget_guard.py

      - name: pip-audit
        run: pip-audit -r requirements.txt
      # 2026-10-10 补：上面的作业**装的是 requirements-dev.txt**，却只审 requirements.txt
      # ⇒ dev 解析集在 CI 读数里从不出现。
      # ⚠️ 勘误（同日，本条注释的第一版写错过）：我起初写"dev 轴确有独立通报"，实测**不成立**——
      #   两份 JSON 逐对比较后是**完全相同**的 15 个 (包, ID)：chromadb / langchain-core /
      #   langchain-openai / langchain-text-splitters / langsmith，dev-only 与 runtime-only 都是 0。
      #   所以这一步今天**不会**多抓出任何漏洞；它的价值是让"dev 解析集将来漂移"这件事有读数，
      #   不是"补一个正在漏的口子"。不缩审计范围、不用 continue-on-error 凑绿——红就让它红。
      - name: pip-audit (dev axis)
        run: pip-audit -r requirements-dev.txt

  frontend:
    name: Frontend · build (lint+tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      # 2026-10-10 补三条独立腿。理由不是"多跑一次"：`next build` 只在没设
      # `eslint.ignoreDuringBuilds` / `typescript.ignoreBuildErrors` 时才顺带检查，
      # 一旦这两个开关被打开（或被继承自某个配置），前端 lint 与类型门会**静默消失**，
      # 而 CI 读数照样绿；vitest 用例则从来不在 build 里。三条分开还能让失败一眼归因。
      # 下一轮若要动 next.config.js，先确认这两个开关仍是关闭态。
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test
      - name: Build
        # 2026-10-11：这一步顺带带上产物断言（J3 的回归腿）。dev 与 build 的形状可以不同——
        # 动态拼出来的类名会被 Tailwind 整条 purge，而此前没有任何测试覆盖这条差异。
        # 断言脚本自带"对照必须为正"：找不到 CSS 或对照为 0 时退出码 2，不允许假装通过。
        # 复用已有的 build 步骤 ⇒ 不增加 CI 耗时（只多一次 grep 级读文件）。
        run: npm run build:check

  source-probe:
    name: Source probe · 出厂镜像源真取（D-25）
    runs-on: ubuntu-latest
    # 独立复核 B（2026-10-11）打中我上一版：只在工作流级加 schedule 不等于这个作业只在计划
    # 与手动触发时跑——`push`/`pull_request` 会连带把它跑上，而我三处文字都写了"不占每次 PR"。
    # 作业级 if 才是那道门；三根触发轴现读：`on` 段 4 根，本作业 if 只放行 schedule/workflow_dispatch。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # 判据不是"索引页 200"，而是"这一版 wheels 文件真取得到"：2026-10-10 的 `[5/9]` 就是
    # 索引页正常、文件 404。torch 单列一根轴——它由 Dockerfile 从 pytorch-wheels 的
    # --find-links 单独装，`-r requirements.txt` 那一步只会看到"已满足"，所以逐包探针覆盖不到它。
    # 两根源各测一遍：主源红 = 降级（构建会走 `||` 回落，仍绿），两源同红 = 出厂构建今天真的建不起来 ⇒ 红。
    # 已知限制：① 逐包解析与整表联合解析可能选到不同版本，本探针量的是"源侧给不给得到"，
    # 不是"依赖图能不能成立"；② 这不等于 `docker build` 通过（模型烘焙那一层不在这里）。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: PyPI 逐包真取文件（阿里云主源 + 官方回落源）
        run: |
          set -uo pipefail
          MIRROR=https://mirrors.aliyun.com/pypi/simple
          OFFICIAL=https://pypi.org/simple
          DEST="$RUNNER_TEMP/source-probe"
          mkdir -p "$DEST"
          logs="$(mktemp -d)"
          mirror_bad=""; both_bad=""; probed=0
          while IFS= read -r spec; do
            [ -z "$spec" ] && continue
            probed=$((probed + 1))
            if pip download --no-deps --no-cache-dir -q -d "$DEST" -i "$MIRROR" "$spec" > "$logs/m.log" 2>&1; then
              continue
            fi
            mirror_bad="$mirror_bad $spec"
            echo "::warning title=镜像取不到::$spec（阿里云主源失败，日志尾：$(tail -1 "$logs/m.log")）"
            if pip download --no-deps --no-cache-dir -q -d "$DEST" -i "$OFFICIAL" "$spec" > "$logs/o.log" 2>&1; then
              continue
            fi
            both_bad="$both_bad $spec"
            echo "::error title=两源都取不到::$spec（官方源日志尾：$(tail -1 "$logs/o.log")）"
          done < <(grep -E '^[A-Za-z0-9]' backend/requirements.txt | grep -viE '^torch(==|[[:space:]]|$)')
          echo "probed=$probed mirror_fail=$(echo "$mirror_bad" | wc -w) both_fail=$(echo "$both_bad" | wc -w)"
          # 正对照：清单为空 ⇒ 这把尺子什么都没量（独立复核 B 抓的假绿形状）。0 个包不许报绿。
          if [ "$probed" -eq 0 ]; then
            echo "::error::逐包清单为空（probed=0）——不是干净，是仪器没接到对象"
            exit 1
          fi
          [ -n "$both_bad" ] && exit 1
          exit 0
      - name: torch CPU wheel 双目录核对（阿里云 + 官方页）
        run: |
          set -uo pipefail
          ver="$(grep -oE '^torch==[0-9][0-9A-Za-z.]*' backend/requirements.txt | head -1 | cut -d= -f3)"
          [ -n "$ver" ] || { echo "::error::requirements.txt 里没有可解析的 torch 钉版"; exit 1; }
          want="torch-${ver}+cpu-cp311-cp311-manylinux_2_28_x86_64.whl"
          probe_page() {
            curl -fsS --max-time 90 "$1" 2>/dev/null \
              | sed -e 's/&#43;/+/g' -e 's/%2B/+/g' > "$2" || return 1
            grep -qF "$want" "$2"
          }
          A=https://mirrors.aliyun.com/pytorch-wheels/cpu/
          O=https://download.pytorch.org/whl/cpu/torch/
          rc_a=0; rc_o=0
          probe_page "$A" "$RUNNER_TEMP/torch-aliyun.html" || rc_a=$?
          probe_page "$O" "$RUNNER_TEMP/torch-official.html" || rc_o=$?
          echo "want=$want aliyun_hit=$([ "$rc_a" -eq 0 ] && echo yes || echo no) official_hit=$([ "$rc_o" -eq 0 ] && echo yes || echo no)"
          if [ "$rc_a" -ne 0 ] && [ "$rc_o" -ne 0 ]; then
            echo "::error::两源都没有 $want ⇒ 出厂构建的 torch 层无路可走"
            exit 1
          fi
          if [ "$rc_a" -ne 0 ]; then
            echo "::warning title=阿里云 pytorch-wheels 缺件::回落源可用，构建会走官方 CPU 页"
          fi
          exit 0
