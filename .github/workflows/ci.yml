name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend · lint/type/test/audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 先装 CPU 版 torch，避免 PyPI 默认拉取数 GB 的 CUDA 包
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy .
      - name: Pytest (skip slow) with coverage
        env:
          PYTEST_ADDOPTS: "-m 'not slow'"
        run: pytest --cov=. --cov-fail-under=70 -q
      # 评测宿主目录（dispatch-output/agent-quality-20260911）不在 backend 的
      # lint/format/test 门禁范围内（backend project 的 testpaths=["tests"]），
      # 2026-09-15 代码审查发现该缺陷（守卫代码曾累积 18 项 lint 违规且无人拦）。
      # 该目录自带 ruff.toml（显式 ignore E402：serve.py 需先设环境再 import main）。
      - name: Dispatch-output lint + guard tests
        run: |
          ruff check ../dispatch-output/agent-quality-20260911
          ruff format --check ../dispatch-output/agent-quality-20260911
          pytest -q ../dispatch-output/agent-quality-20260911/test_budget_guard.py

      - name: pip-audit
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend · build (lint+tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
